name: Monitor de Preços

on:
  schedule:
    # 11h e 23h UTC = 8h e 20h no horário de Brasília
    - cron: '0 11,23 * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só mandar uma mensagem de teste no WhatsApp'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-precos

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar script
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python main.py ${{ inputs.teste && '--teste' || '' }}

      - name: Salvar estado
        if: ${{ !inputs.teste }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add estado.json
          git diff --staged --quiet || git commit -m "Atualizar estado dos preços [skip ci]"
          git push || true
